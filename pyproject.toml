[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omniimage"
version = "0.8.0"
description = "Open-source node-based media engine for images, video, audio, VFX, SFX and LUTs, with a built-in AI Media Copilot."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["vfx", "nodes", "lut", "color-grading", "audio", "video", "compositing", "copilot", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
exr = ["OpenEXR>=3.3"]
otio = ["opentimelineio>=0.16"]
dev = ["pytest>=7", "opentimelineio>=0.16"]

[project.scripts]
omni = "omniimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniimage = ["gui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
